name: Load benchmark evidence

on:
  pull_request:
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "src/**"
      - "scripts/load/**"
      - ".github/workflows/benchmark.yml"
  workflow_dispatch:
    inputs:
      duration:
        description: Duration of each run (1s to 30s)
        required: true
        default: "30s"
        type: string
      concurrency:
        description: Normal-load concurrent clients
        required: true
        default: "50"
        type: string
      threads:
        description: wrk worker threads
        required: true
        default: "4"
        type: string
      repetitions:
        description: Repetitions for each load profile (1 to 3)
        required: true
        default: 3
        type: number

permissions:
  contents: read

jobs:
  benchmark:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: x86_64
          - runner: ubuntu-24.04-arm
            arch: aarch64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install benchmark utilities
        run: sudo apt-get update && sudo apt-get install --yes nginx openssl wrk sysstat
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.96.0 --profile minimal
      - name: Build optimized Relay
        run: cargo +1.96.0 build --locked --release
      - name: Run repeated normal and connection-cap profiles
        env:
          DURATION: ${{ inputs.duration || '30s' }}
          NORMAL_CONCURRENCY: ${{ inputs.concurrency || '50' }}
          THREADS: ${{ inputs.threads || '4' }}
          REPETITIONS: ${{ inputs.repetitions || '3' }}
          ARCH: ${{ matrix.arch }}
        run: |
          [[ "$DURATION" =~ ^([1-9]|1[0-9]|2[0-9]|30)s$ ]]
          [[ "$NORMAL_CONCURRENCY" =~ ^[1-9][0-9]?$ ]]
          [[ "$THREADS" =~ ^([1-9]|1[0-6])$ ]]
          [[ "$REPETITIONS" =~ ^[1-3]$ ]]
          for profile in normal connection-cap; do
            if [[ "$profile" == normal ]]; then
              concurrency="$NORMAL_CONCURRENCY"
            else
              concurrency=256
            fi
            output="benchmark-${ARCH}-${profile}.txt"
            : > "$output"
            for repetition in $(seq 1 "$REPETITIONS"); do
              echo "===== $profile repetition $repetition of $REPETITIONS =====" \
                | tee -a "$output"
              DURATION="$DURATION" THREADS="$THREADS" CONCURRENCY="$concurrency" \
                bash scripts/load/run-linux-local.sh target/release/relay /usr/sbin/nginx \
                | tee -a "$output"
            done
          done
          SHUTDOWN_STRESS=1 SHUTDOWN_LOAD_DURATION=30s DURATION=30s THREADS="$THREADS" \
            CONCURRENCY=256 bash scripts/load/run-linux-local.sh \
            target/release/relay /usr/sbin/nginx | tee "benchmark-${ARCH}-shutdown.txt"
      - name: Measure TLS 1.3 new-connection throughput
        env:
          TLS_DURATION: 15
        run: |
          set -o pipefail
          bash scripts/load/run-tls-handshake-linux.sh target/release/relay \
            | tee "benchmark-${{ matrix.arch }}-tls.txt"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: benchmark-${{ matrix.arch }}
          path: benchmark-${{ matrix.arch }}-*.txt
          if-no-files-found: error
