name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Rust version
        run: rustc --version --verbose
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Tests
        run: cargo test --locked
      - name: Release verifier tamper checks
        run: bash scripts/release/test-verify-artifacts.sh
      - name: Release build
        run: cargo build --locked --release
      - name: Verify systemd deployment unit
        run: bash scripts/release/verify-systemd-unit.sh
      - name: Verify clean repeat build
        run: |
          sha256sum target/release/relay | tee "$RUNNER_TEMP/relay-first-build.sha256"
          cargo clean --release
          cargo build --locked --release
          sha256sum target/release/relay | tee "$RUNNER_TEMP/relay-second-build.sha256"
          cmp "$RUNNER_TEMP/relay-first-build.sha256" "$RUNNER_TEMP/relay-second-build.sha256"
