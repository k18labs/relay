name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Rust version
        run: rustc --version --verbose
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Tests
        run: cargo test --locked
      - name: Release build
        run: cargo build --locked --release
      - name: Verify clean repeat build
        run: |
          sha256sum target/release/relay | tee "$RUNNER_TEMP/relay-first-build.sha256"
          cargo clean --release
          cargo build --locked --release
          sha256sum target/release/relay | tee "$RUNNER_TEMP/relay-second-build.sha256"
          cmp "$RUNNER_TEMP/relay-first-build.sha256" "$RUNNER_TEMP/relay-second-build.sha256"
