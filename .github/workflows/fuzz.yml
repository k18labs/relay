name: Fuzz smoke

on:
  pull_request:
  schedule:
    - cron: "41 7 * * 3"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fuzz:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install pinned nightly and cargo-fuzz
        run: |
          rustup toolchain install nightly-2026-11-25 --profile minimal
          cargo +nightly-2026-11-25 install cargo-fuzz --version 0.13.2 --locked
      - name: Build fuzz targets
        run: |
          for target in config_routes host_normalization header_policy http1_server http2_server http3_server; do
            cargo +nightly-2026-11-25 fuzz build "$target" --fuzz-dir fuzz
          done
      - name: Bounded fuzz smoke
        run: |
          for target in config_routes host_normalization header_policy http1_server http2_server http3_server; do
            cargo +nightly-2026-11-25 fuzz run "$target" --fuzz-dir fuzz -- -max_total_time=30 -max_len=65536 -timeout=5
          done
      - name: Save crash artifacts
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: relay-fuzz-artifacts
          path: fuzz/artifacts/
          if-no-files-found: ignore
