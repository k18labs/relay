[package]
name = "relay"
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
license = "Apache-2.0"
description = "A lightweight, security-first HTTP reverse proxy"

[dependencies]
bytes = "1"
clap = { version = "4", default-features = false, features = ["derive", "help", "std"] }
http = "1"
http-body = "1"
http-body-util = "0.1"
h3 = { version = "0.0.8", default-features = false }
h3-quinn = { version = "0.0.10", default-features = false }
hyper = { version = "1", default-features = false, features = ["http1", "http2", "server", "client"] }
hyper-rustls = { version = "0.27.10", default-features = false, features = ["aws-lc-rs", "http1"] }
hyper-util = { version = "0.1", features = ["client", "client-legacy", "http1", "http2", "server", "service", "tokio"] }
quinn = { version = "0.11.11", default-features = false, features = ["runtime-tokio", "rustls-aws-lc-rs"] }
rustls = { version = "0.23.46", default-features = false, features = ["aws_lc_rs", "std"] }
serde = { version = "1", features = ["derive"] }
thiserror = "2"
tokio = { version = "1", default-features = false, features = ["io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["aws_lc_rs"] }
toml = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["env-filter", "fmt", "registry", "std"] }
tower-service = "0.3"
webpki-roots = "1.0"

[profile.release]
lto = true
codegen-units = 1
strip = true
